<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>400米配速计算器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>400米配速计算器</h1>

    <div class="input-row">
      <label for="timeInput">目标成绩（秒）：</label>
      <input type="number" id="timeInput" step="0.1" placeholder="例如 52.5">
    </div>

    <button id="calcBtn">计算</button>

    <div id="result" class="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
